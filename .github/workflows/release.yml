name: Release

# Runs when a version tag is pushed, e.g. v0.1.0. Builds both architectures, compiles the installers,
# and publishes a GitHub Release with SHA256SUMS.txt.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      # The tag name reaches scripts only through env (REF_NAME), never as an expression pasted into a script, so
      # a crafted tag cannot inject PowerShell.
      - name: Work out the version and check it matches the tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:REF_NAME.TrimStart('v')
          $cmake = Select-String -Path CMakeLists.txt -Pattern 'project\(NetworkSpeedMonitor VERSION (\d+\.\d+\.\d+)'
          $cmakeVersion = $cmake.Matches[0].Groups[1].Value
          if ($cmakeVersion -ne $version) { throw "Tag $version does not match CMakeLists.txt version $cmakeVersion" }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DNSM_SOURCE_URL=https://github.com/${{ github.repository }}"
      - name: Build x64 Release
        run: cmake --build build --config Release
      - name: Unit tests
        run: build\tests\Release\nsm_tests.exe -tse="integration"
      - name: Integration tests
        run: build\tests\Release\nsm_tests.exe -ts="integration"

      - name: Configure ARM64
        run: cmake -S . -B build-arm64 -G "Visual Studio 17 2022" -A ARM64 "-DNSM_SOURCE_URL=https://github.com/${{ github.repository }}"
      - name: Build ARM64 Release
        run: cmake --build build-arm64 --config Release

      # tools/check_imports.ps1 comes from Task 18 (the no-network import check). This step fails on purpose
      # if the script is missing, so a release can never skip the check.
      - name: Check imports (no network DLLs)
        run: |
          if (-not (Test-Path tools/check_imports.ps1)) { throw 'tools/check_imports.ps1 is missing; a release must not skip the import check.' }
          foreach ($exe in 'build\src\ui\Release\NetworkSpeedMonitor.exe', 'build-arm64\src\ui\Release\NetworkSpeedMonitor.exe') {
            & ./tools/check_imports.ps1 $exe
            if ($LASTEXITCODE -ne 0) { throw "Import check failed for $exe" }
          }

      # The installers are compiled from stage\<arch>\NetworkSpeedMonitor.exe, so signing the app (below) can
      # replace the exes in place before they are packed.
      - name: Stage the app executables
        run: |
          foreach ($pair in @(@('x64', 'build'), @('arm64', 'build-arm64'))) {
            New-Item -ItemType Directory -Force "stage\$($pair[0])" | Out-Null
            Copy-Item "$($pair[1])\src\ui\Release\NetworkSpeedMonitor.exe" "stage\$($pair[0])\"
          }

      # ---- Code signing (DISABLED until the SignPath Foundation approves the project). ----
      # To enable it, follow docs/signing.md: add the secrets and variables, then change `if: false` to
      # `if: true` on ALL FOUR signing steps (two here for the app, two after the installers).
      - name: Upload unsigned app for SignPath
        if: false
        id: upload-unsigned-app
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-app
          path: stage/
      - name: Sign the app with SignPath
        if: false
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.upload-unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: stage

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installers
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DMyAppVersion=$env:VERSION" /DMyArch=x64 "/DSourceExe=$PWD\stage\x64\NetworkSpeedMonitor.exe" installer\NetworkSpeedMonitor.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed (x64)' }
          & $iscc "/DMyAppVersion=$env:VERSION" /DMyArch=arm64 "/DSourceExe=$PWD\stage\arm64\NetworkSpeedMonitor.exe" installer\NetworkSpeedMonitor.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed (arm64)' }

      # The signed installers replace the unsigned ones in dist\ before the checksums are computed.
      - name: Upload unsigned installers for SignPath
        if: false
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installers
          path: dist/*.exe
      - name: Sign installers with SignPath
        if: false
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: release-signing
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist

      - name: Write SHA256SUMS.txt
        run: |
          Push-Location dist
          Get-ChildItem *.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Out-File -FilePath SHA256SUMS.txt -Encoding ascii
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # gh does not expand wildcards on Windows: pass every file by its full path.
          $files = @((Get-ChildItem dist\*.exe).FullName) + (Resolve-Path dist\SHA256SUMS.txt).Path
          # SignPath asks for the term "Code signing policy" on the release page; --notes goes above the
          # generated notes.
          $notes = "Check a download against ``SHA256SUMS.txt`` before running it. " +
                   "[Code signing policy](https://github.com/$env:GITHUB_REPOSITORY#code-signing-policy)"
          gh release create $env:REF_NAME @files --title "Network Speed Monitor $env:VERSION" --notes $notes --generate-notes --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
