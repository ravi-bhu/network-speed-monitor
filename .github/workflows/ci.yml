name: CI

# Site-only changes don't touch the C++ build, so skip the slow Windows run for them.
on:
  push:
    paths-ignore:
      - 'site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths-ignore:
      - 'site/**'
      - '.github/workflows/pages.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - name: Configure x64
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build Debug
        run: cmake --build build --config Debug
      - name: Build Release
        run: cmake --build build --config Release
      - name: Import check (no networking DLLs)
        shell: pwsh
        run: |
          ./tools/check_imports.ps1 build\src\ui\Release\NetworkSpeedMonitor.exe
          ./tools/check_imports.ps1 -SelfTest C:\Windows\System32\curl.exe
      - name: Unit tests
        run: build\tests\Release\nsm_tests.exe -tse="integration"
      - name: Integration tests
        continue-on-error: false
        run: build\tests\Release\nsm_tests.exe -ts="integration"
      - name: Configure ARM64
        run: cmake -S . -B build-arm64 -G "Visual Studio 17 2022" -A ARM64
      - name: Build ARM64 Release (no tests run)
        run: cmake --build build-arm64 --config Release
